# Loopback boot: Some already running GRUB is loading us.
# We expect $root to point to the loop device.
# $prefix points to the running GRUBs files and we should not change it,
# as we will mix modules from different GRUB installs then.
#
# Set grml_cfgdir to the GRML-style GRUB layout.
set grml_cfgdir="(${root})/boot/grub"
export grml_cfgdir
source "${grml_cfgdir}/grub.cfg"
