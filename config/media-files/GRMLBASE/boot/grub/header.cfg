set default=0
set timeout=20

if loadfont unicode ; then
   insmod png
   # Default to a "small" resolution to avoid completely unreadable high-res modes.
   set gfxmode=1280x1024,1024x768,auto
 
   if [ "${grub_platform}" == "efi" ] ; then
     insmod efi_gop
   fi
   if [ "${grub_platform}" == "pc" ] ; then
     # x86 BIOS boot only
     insmod vbe
     insmod video_bochs
     insmod video_cirrus
   fi

   insmod gfxterm
   terminal_output gfxterm
fi

if [ "${grub_platform}" == "efi" ] ; then
  if [ "${grml_secureboot}" = "true" ] ; then
    set grmltheme=uefisec
  else
    set grmltheme=uefi
  fi
else
  set grmltheme=bios
fi

# custom branding
set theme="${grml_cfgdir}/grml-theme/${grmltheme}.txt"
export theme

if [ -z "${iso_path}" ] ; then
  probe --set=grml_fs --fs "${root}"
  # if booted from ISO (or dd-ed ISO), assume root= in initrd config is correct.
  if [ "${grml_fs}" != "iso9660" ] ; then
    probe --set=grml_fsuuid --fs-uuid "${root}"
    set loopback="root=live:UUID=${grml_fsuuid}"
    export loopback
  fi
else
  set loopback="iso-scan/filename=${iso_path}"
  export loopback
fi
