## grub2 configuration

# secure boot, read only if not already sourced elsewhere
# when booted via loopback, GRUB sets $iso_path
if [ "${grml_secureboot}" = "" -a -z "${iso_path}" ] ; then
    if [ -f "${prefix}/../../secureboot/grub.cfg" ] ; then
        source "${prefix}/../../secureboot/grub.cfg"
    fi
fi

# directory holding our configuration files
if [ -z "${grml_cfgdir}" ] ; then
    set grml_cfgdir="${prefix}"
fi

if [ -f "${grml_cfgdir}/grub_local_custom_early.cfg" ] ; then
    source "${grml_cfgdir}/grub_local_custom_early.cfg"
fi

source "${grml_cfgdir}/header.cfg"

insmod regexp

if [ -f "${grml_cfgdir}/grub_local_custom_pre_entry.cfg" ] ; then
    source "${grml_cfgdir}/grub_local_custom_pre_entry.cfg"
fi

for config in "${grml_cfgdir}"/*_default.cfg ; do
    source "$config"
    regexp --set 1:config "(.+)_default.cfg" "$config"
    set config="${config}_options.cfg"
    source "$config"
done

# separator entry, no action
menuentry "" {
    true
}

if [ -f "${grml_cfgdir}/addons.cfg" ] ; then
    source "${grml_cfgdir}/addons.cfg"
fi

if [ -f "${grml_cfgdir}/help.cfg" ] ; then
    source "${grml_cfgdir}/help.cfg"
fi

if [ "${grub_platform}" == "efi" ] ; then
menuentry "UEFI Firmware Settings" {
    fwsetup
}
fi # efi mode

menuentry "Boot from next device" {
    exit
}

source "${grml_cfgdir}/footer.cfg"

if [ -f "${grml_cfgdir}/grub_local_custom_late.cfg" ] ; then
    source "${grml_cfgdir}/grub_local_custom_late.cfg"
fi

# EOF
