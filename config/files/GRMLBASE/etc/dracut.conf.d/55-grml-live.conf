# force-add live boot support
add_dracutmodules+=" grml dmsquash-live "

# enable XZ compression, reducing initramfs size from ~50MB to ~33M
compress="xz"

# should boot on any hardware
hostonly="no"
machine_id="no"
reproducible="yes"

# Avoid installing fsck tools into the initramfs
nofscks="yes"

# Useful for USB boot
filesystems+=" exfat "

# video support on arm64 in libvirt/qemu
add_drivers+=" virtio_gpu "
